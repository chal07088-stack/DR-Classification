[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "dr-classification"
version = "0.2.0"
description = "Patient-level paired-organ ordinal fusion and boundary rollback"
requires-python = ">=3.11,<3.13"
dependencies = [
  "torch==2.11.0", "torchvision==0.26.0", "timm==1.0.28",
  "numpy==2.2.6", "scipy==1.15.3", "scikit-learn==1.7.2",
  "pillow==12.2.0", "matplotlib==3.10.9", "dvc>=3.60,<4",
]

[project.scripts]
drpair = "drpair.cli:main"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/drpair"]

[tool.uv.sources]
torch = { index = "pytorch-cu128" }
torchvision = { index = "pytorch-cu128" }

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
