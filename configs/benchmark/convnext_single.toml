[benchmark]
method = "B0"
seed = 42
train_csv = "data/splits/eyepacs_quick20_train.csv"
val_csv = "data/splits/eyepacs_quick20_val.csv"
test_csv = "data/splits/eyepacs_quick20_test.csv"
cache_root = "data/cache/quick20_huang_512"
image_size = 384
batch_size = 4
effective_batch_size = 16
workers = 4
max_epochs = 20
patience = 4
optimizer = "adamw"
learning_rate = 0.0001
momentum = 0.9
weight_decay = 0.0001
schedule = "cosine"
smoke_samples = 8
initialization = "torchvision ConvNeXt_Small_Weights.IMAGENET1K_V1"
pretrained_data = "ImageNet-1K; no DR-specific checkpoint"
